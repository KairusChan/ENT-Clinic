<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Clinic | Search Patient</title>
    <link rel="stylesheet" href="../css/styles.css">
<script src="../Javascript/native-push.js" defer></script><script src="../Javascript/native-camera.js" defer></script></head>

<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">ENT</div>
            <div><strong>ENT Clinic</strong><small>Doctor workspace</small></div>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <p class="sidebar-title">ENT CLINIC</p>
            <nav><a class="nav-item" href="index.html">Dashboard</a><a class="nav-item" href="queue.html">Today's
                    Patients / Queue</a><a class="nav-item active" href="search.html">Patient Lists</a><a
                    class="nav-item" href="schedule.html">My Schedule</a></nav>
            <div class="nav-bottom"><a class="nav-item logout-link" href="../index.html">Logout</a></div>
        </aside>
        <main>
            <div class="page-head">
                <div>
                    <div class="eyebrow">Clinic workspace</div>
                    <h1>Find a patient</h1>
                    <p>Search by name, contact number, patient ID, or birthday.</p>
                </div>
            </div>
            <section class="panel">
                <h2>Search Patient</h2>
                <div class="search-row"><input id="patient-search"
                        placeholder="Search by name, ID, contact, or birthday" aria-label="Search patients"><button
                        class="small" id="patient-search-button" type="button">Search</button></div>
                <div class="section-title">
                    <h3>Search Results</h3>
                </div>
                <div id="patient-results" aria-live="polite">
                    <p id="patient-results-status">Loading patient records...</p>
                </div>

            </section>

        </main>
    </div>
    <script src="../Javascript/supabase-vendor.js" defer></script>
    <script src="../Javascript/supabase-config.js" defer></script>
    <script src="../Javascript/supabase-client.js" defer></script>
    <script src="../Javascript/session.js" defer></script>
    <script src="../Javascript/patient-search.js" defer></script>
</body>

</html>
